version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safereplay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: safereplay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: safereplay-server
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/safereplay
      AI_PROVIDER: mock
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  postgres_data:
